<div class="dpad" id="dpad" role="group" aria-label="방향 이동">
<button class="dpad-button up" data-direction="up" aria-label="위로 이동">
<span class="dpad-arrow">▲</span>
</button>
<button class="dpad-button left" data-direction="left" aria-label="왼쪽 이동">
<span class="dpad-arrow">◀</span>
</button>
<button class="dpad-button right" data-direction="right" aria-label="오른쪽 이동">
<span class="dpad-arrow">▶</span>
</button>
<button class="dpad-button down" data-direction="down" aria-label="아래로 이동">
<span class="dpad-arrow">▼</span>
</button>
</div>
