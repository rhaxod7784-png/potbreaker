name: Hydrate Android source

on:
  push:
    branches:
      - feature/android-v0.16.0
    paths:
      - archive/POT_BREAKER_Android_v0.16.0.zip
      - .github/workflows/hydrate-android-source.yml

permissions:
  contents: write

jobs:
  hydrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-v0.16.0
          fetch-depth: 0

      - name: Extract canonical Android package
        run: |
          rm -rf .hydrate
          mkdir .hydrate
          unzip -q archive/POT_BREAKER_Android_v0.16.0.zip -d .hydrate
          cp -a .hydrate/POT_BREAKER_Android_v0.16.0/. .
          rm -rf .hydrate

      - name: Commit hydrated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree already matches archive."
            exit 0
          fi
          git commit -m "chore: hydrate Android source tree from v0.16.0 archive"
          git push origin HEAD:feature/android-v0.16.0
