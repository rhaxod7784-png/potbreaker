name: Ginkgo Tree Breaker build and checks
on:
  push:
    branches:
      - feat/ginkgo-tree-breaker-v0-6-20261030
  pull_request:
    paths:
      - web/ginkgo.html
      - cloudflare/ginkgo-api.js
      - scripts/build_worker.py
      - wrangler.toml
      - tests/test_ginkgo_static.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ginkgo-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python syntax and static regressions
        run: |
          python -m py_compile scripts/build_worker.py
          python -m unittest discover -s tests -p 'test_ginkgo_static.py' -v
      - name: Build Worker from exact branch assets
        run: python scripts/build_worker.py
      - name: Check generated Worker JavaScript
        run: |
          node --check cloudflare/ginkgo-api.js
          node --check cloudflare/worker.js
          node tests/test_ginkgo_rules.cjs
          python - <<'PY'
          import re,subprocess,tempfile
          from pathlib import Path
          html=Path("web/ginkgo.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script[^>]*>(.*?)</script>",html,re.S|re.I)
          assert scripts, "No inline game script"
          for code in scripts:
              with tempfile.NamedTemporaryFile(mode="w",suffix=".cjs",encoding="utf-8") as fp:
                  fp.write(code);fp.flush()
                  subprocess.run(["node","--check",fp.name],check=True)
          print("Inline client scripts compile.")
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path("cloudflare/worker.js").read_text(encoding="utf-8")
          for name in ["GINKGO_PAGES", "ginkgoAPI(request,env)", "ginkgoSitemap", "ginkgoCronCleanup", "pb-game-mode", "POTBREAKER_DB"]:
              assert name in s, f"Missing {name}"
          for path in ["/ginkgo", "/ginkgo/en", "/ginkgo/ja", "/ginkgo/zh"]:
              assert path in s, path
          print("Ginkgo routes, worker API, mode menu and SEO entries found.")
          PY
      - name: Integration smoke test against isolated Cloudflare QA Worker (network-dependent)
        continue-on-error: true
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          base="https://potbreaker-ginkgo-qa-20261030.rhaxod7784.workers.dev"
          def get(path):
              with urllib.request.urlopen(base+path,timeout=15) as r:
                  return r.status,r.read().decode()
          def post(path,body):
              req=urllib.request.Request(base+path,data=json.dumps(body).encode(),headers={"content-type":"application/json"},method="POST")
              with urllib.request.urlopen(req,timeout=15) as r:
                  return r.status,json.load(r)
          status,body=get("/health")
          assert status==200 and json.loads(body)["db"] is True
          for p in ["/ginkgo","/ginkgo/en","/ginkgo/ja","/ginkgo/zh"]:
              code,html=get(p)
              assert code==200 and "<title>" in html and 'lang="' in html, p
          status,run=post("/api/ginkgo/start",{"difficulty":"very_hard"})
          assert status==200 and len(run["cells"])==91
          status,state=get("/api/ginkgo/state?run="+run["run_id"])
          assert status==200 and len(json.loads(state)["cells"])==91
          code,tap=post("/api/ginkgo/tap",{"run_id":run["run_id"],"index":0})
          assert code==200 and tap["score"]>=0
          code,ranking=get("/api/ginkgo/rankings?difficulty=normal")
          assert code==200 and "rankings" in json.loads(ranking)
          print("Deployed QA Worker: health, 4 locales, D1 start/state/tap/rankings passed.")
          PY
      - name: Store generated Worker on feature branch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- cloudflare/worker.js web/index.html; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker.js
          git commit -m "build(ginkgo): refresh generated Worker bundle"
          git push origin HEAD:${{ github.ref_name }}
