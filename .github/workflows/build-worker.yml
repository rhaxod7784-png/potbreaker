name: Build Cloudflare Worker

on:
  push:
    branches:
      - feat/potbreaker-seo-adsense
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Worker bundle
        run: python scripts/build_worker.py
      - name: Commit generated Worker
        run: |
          if git diff --quiet -- cloudflare/worker.js; then
            echo "Worker bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker.js
          git commit -m "Build Worker for SEO release"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Wrangler
        run: npm ci
      - name: Deploy Worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run deploy
      - name: Note missing deployment credential
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo 'Worker bundle built; deployment skipped because CLOUDFLARE_API_TOKEN is not configured in GitHub Actions.'
