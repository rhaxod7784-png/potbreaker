name: Build Cloudflare Worker

on:
  push:
    branches:
      - feat/potbreaker-seo-adsense
      - feat/ginkgo-tree-breaker-v0-6
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate Worker bundle
        run: |
          python -m py_compile scripts/build_worker.py
          python scripts/build_worker.py
          node --check cloudflare/worker.js
          python -m pytest tests/test_potbreaker_re.py -q
      - name: Commit generated Worker
        run: |
          if git diff --quiet -- cloudflare/worker.js; then
            echo "Worker bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/worker.js
          git commit -m "Build Worker for SEO release"
          git push origin HEAD:${{ github.ref_name }}
