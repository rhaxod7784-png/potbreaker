name: Floor Breaker module and Worker QA
on:
  push:
    branches: [feat/floor-breaker-theme3-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m py_compile web/floor_modules.py web/game_engine.py scripts/build_worker.py
      - name: Run Floor Breaker rules tests
        run: python -m unittest discover -s tests -p 'test_floor_breaker.py' -v
      - name: Assemble Cloudflare Worker
        run: python scripts/build_worker.py
      - name: Verify JavaScript syntax
        run: node --check cloudflare/worker.js
      - name: Verify route, SEO and no ad adjacent to gameplay
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('web/floor.html').read_text()
          worker = Path('cloudflare/worker.js').read_text()
          assert 'https://potbreaker.com/floor' in page
          assert 'rel="canonical"' in page and '<meta name="description"' in page
          assert 'FLOOR_PAGE' in worker and 'floorSitemap' in worker
          assert 'if(path==="/floor"||path==="/floor/")' in worker
          assert 'floor_modules.py' in Path('scripts/build_worker.py').read_text()
          assert 'adsbygoogle.js' not in page  # No ads on move/attack controls
          print('Floor route, sitemap, title, canonical, and safe ad placement verified')
          PY
